<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Pankaj Lochan Shaw</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/skins/color-1.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-black-900);
      color: var(--text-black-900);
    }
    .error-card {
      background: var(--bg-black-100);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 50px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--card-shadow);
    }
    .error-code {
      font-size: 84px;
      font-weight: 800;
      color: var(--skin-color);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .error-desc {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="error-page-container">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        The page you are looking for doesn't exist or has been moved. Let's get you back to the portfolio!
      </p>
      <a href="index.html#home" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Return to Portfolio Home
      </a>
    </div>
  </div>
</body>
</html>
